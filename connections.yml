# =============================================================================
#  CQA Server — подключения к проверяемым системам
#
#  Справочник внешних сервисов, в которые ходит ТЕСТИРОВЩИК: CDI и УЧАСТНИКИ.
#  Подключается из application.yml через spring.config.import.
#
#  Своя инфраструктура ТЕСТИРОВЩИКА (PostgreSQL, Redis, Kafka) сюда не входит —
#  она описывается стандартными ключами Spring: spring.datasource, spring.kafka...
#
#  Секреты (логины, пароли) — только через переменные окружения ${...},
#  значения в этом файле не хранятся. Список переменных — в .env.example.
# =============================================================================


# -----------------------------------------------------------------------------
#  Структура:
#
#    cqa.connections.<СЕРВИС>.<КОНТУР>
#
#    СЕРВИС  — typeService из сценария: CDI, WAY4, SIEBEL...
#    КОНТУР  — scope из сценария: DEV, IFT...
#
#  Новое подключение — новый блок, код при этом не меняется.
# -----------------------------------------------------------------------------

cqa:
  connections:


    # -------------------------------------------------------------------------
    #  CDI — MDM-решение с золотыми карточками
    #  (пример — заменить реальными адресами)
    # -------------------------------------------------------------------------

    CDI:
      DEV:
        # тип адаптера: REST | SOAP | KAFKA
        type: SOAP
        # адрес сервиса — только из окружения
        url: ${CDI_DEV_URL}
        # сколько ждать установки соединения
        connect-timeout: 10s
        # сколько ждать ответа после отправки запроса
        read-timeout: 30s
        auth:
          # учётные данные — только из окружения
          username: ${CDI_DEV_USER}
          password: ${CDI_DEV_PASSWORD}
