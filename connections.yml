cqa:
  api:
    paths:
      # REST POST: проверка запроса saveAndMerge и пересылка в МДМ
      save-and-merge: ${CQA_PATH_SAVE_AND_MERGE:/mdm/saveAndMerge}
      # REST GET/POST: приветствие оператору (имя и фамилия)
      greeting-operator: ${CQA_PATH_GREETING_OPERATOR:/hello}
      # REST GET/POST: приветствие внешнему сервису
      greeting-service: ${CQA_PATH_GREETING_SERVICE:/helloService}
      # REST POST: эхо — вернуть полученный запрос, проверка связи
      echo: ${CQA_PATH_ECHO:/echo}
      # REST POST: создание и сохранение сценария
      scenarios: ${CQA_PATH_SCENARIOS:/scenarios}
      # SOAP POST: единый адрес всех SOAP-операций, WSDL — <путь>/greeting.wsdl, <путь>/echo.wsdl
      soap: ${CQA_PATH_SOAP:/services}
  save-and-merge:
    mdm:
      scope: ${CQA_MDM_SCOPE:DEV}
  connections:
    MDM:
      DEV:
        type: REST
        url: ${MDM_DEV_URL}
        connect-timeout: 10s
        read-timeout: 30s
        endpoints:
          save-and-merge: ${MDM_DEV_REST_SAM}
        auth:
          username: ${MDM_DEV_USER}
          password: ${MDM_DEV_PASSWORD}

spring:
  webservices:
    path: ${cqa.api.paths.soap}
