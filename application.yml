spring:
  application:
    name: cqa-server
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./connections.yml
  mvc:
    servlet:
      load-on-startup: 1

server:
  port: ${SERVER_PORT:8990}

spring.datasource:
  url: ${CQA_DB_URL:jdbc:sqlite:cqa-journal.db?foreign_keys=true&journal_mode=WAL&busy_timeout=5000}
  hikari:
    connection-timeout: 3000

spring.sql.init:
  mode: never
cqa.journal:
  fallback-dir: logs

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    disable-swagger-default-url: true

scalar:
  telemetry: false
  with-default-fonts: false

logging:
  file:
    name: logs/cqa-server.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      total-size-cap: 50MB
      max-history: 28
      clean-history-on-start: true
