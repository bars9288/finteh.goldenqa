# =============================================================================
#  CQA Server — конфигурация приложения "Единый Тестировщик - CommonQA"
#
#  Файл лежит в корне репозитория, а не внутри jar: Spring Boot читает его
#  из рабочего каталога процесса, поэтому запускать нужно из корня.
# =============================================================================


# -----------------------------------------------------------------------------
#  Приложение
# -----------------------------------------------------------------------------

spring:
  application:
    # имя приложения: попадает в логи и служебные эндпоинты
    name: cqa-server
  config:
    import:
      # локальные значения переменных (.env, в гит не попадает); [.properties]
      # подсказывает Spring формат: строки ИМЯ=значение. Настоящие переменные
      # окружения важнее файла — на стенде без .env всё работает как раньше
      - optional:file:./.env[.properties]
      # подключения к проверяемым системам — в отдельном файле рядом
      - optional:file:./connections.yml
    # optional: приложение стартует, даже если файла нет


# -----------------------------------------------------------------------------
#  Веб-сервер
# -----------------------------------------------------------------------------

server:
  # порт HTTP; переопределяется переменной окружения SERVER_PORT
  port: ${SERVER_PORT:8990}


# -----------------------------------------------------------------------------
#  Документация API: OpenAPI + Swagger UI
# -----------------------------------------------------------------------------

springdoc:
  api-docs:
    # машиночитаемое описание API в формате OpenAPI (JSON)
    path: /v3/api-docs
  swagger-ui:
    # страница Swagger UI
    path: /swagger-ui.html
    # операции внутри группы сортируются по HTTP-методу
    operations-sorter: method
    # убирает petstore.swagger.io из swagger-initializer.js — контур без интернета
    disable-swagger-default-url: true


# -----------------------------------------------------------------------------
#  Документация API: Scalar — вторая читалка OpenAPI, рядом со Swagger UI на /scalar
# -----------------------------------------------------------------------------

scalar:
  # телеметрия наружу — в закрытом контуре недопустима
  telemetry: false
  # шрифты по умолчанию грузятся с fonts.scalar.com, в офлайне их не будет
  with-default-fonts: false


# -----------------------------------------------------------------------------
#  Логирование
#
#  Один файл на всё приложение, рядом с ним же консоль.
#  Путь относительный — считается от рабочего каталога процесса.
# -----------------------------------------------------------------------------

logging:
  file:
    # текущий файл лога
    name: logs/cqa-server.log
  logback:
    rollingpolicy:
      # текущий файл больше 10 МБ не растёт — дальше уходит в архив
      max-file-size: 10MB
      # суммарный объём архивов; при превышении удаляются самые старые
      total-size-cap: 10MB
      # архивы старше 7 дней не хранятся
      max-history: 7
      # подчистить архивы при старте, а не ждать первой ротации
      clean-history-on-start: true
